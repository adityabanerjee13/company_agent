[project]
name = "company-agent"
version = "0.1.0"
description = "Slack AI coworker: chat history search, GitHub PR assistant and coding jobs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.4",
    "docker>=7.1.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain>=1.4.4",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "load-dotenv>=0.1.0",
    "rank-bm25>=0.2.2",
    "slack-bolt>=1.30.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
